name: ShadowCast CI

on:
  push:
    branches: [main, master, beta]
  pull_request:

permissions:
  contents: read

jobs:
  library-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: signaling/go.sum
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: chromium-test-results
          path: test-results/
          if-no-files-found: ignore

  signaling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: signaling
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: signaling/go.sum
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go build -mod=readonly ./...

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build and wait for Compose services
        run: docker compose up --build --wait --wait-timeout 60
      - name: Verify published HTTP endpoints
        run: |
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail --silent --show-error --max-time 10 http://127.0.0.1:8080/ready
          curl --fail --silent --show-error --max-time 10 --output /dev/null http://127.0.0.1:3000/
          curl --fail --silent --show-error --max-time 10 --output /dev/null http://127.0.0.1:3000/shadowcast-sw.js
      - name: Show container status and logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps
      - if: always()
        run: docker compose down

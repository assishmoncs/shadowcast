name: ShadowCast CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  test-library:
    name: Build & Test TypeScript Library
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'library/package.json'

      - name: Install Dependencies
        working-directory: ./library
        run: npm ci --workspaces=false

      - name: Build Library
        working-directory: ./library
        run: npm run build

      - name: Run Test Suite
        working-directory: ./library
        run: npm test

  build-signaling:
    name: Build Go Signaling Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: 'signaling/go.sum'

      - name: Tidy and Build Signaling Server
        working-directory: ./signaling
        run: |
          go mod tidy
          go build -v .

  build-demo:
    name: Build Next.js Demo Application
    runs-on: ubuntu-latest
    needs: [test-library]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Library First
        working-directory: ./library
        run: |
          npm ci --workspaces=false
          npm run build

      - name: Install Demo Dependencies & Build
        working-directory: ./demo
        run: |
          npm ci --workspaces=false
          npm run build
        env:
          NEXT_PUBLIC_SIGNALING_URL: ws://localhost:8080/ws

services:
  signaling:
    build: ./signaling
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      ALLOWED_ORIGIN: "http://localhost:${SHADOWCAST_DEMO_PORT:-3000},http://127.0.0.1:${SHADOWCAST_DEMO_PORT:-3000}"

  demo:
    build:
      context: .
      dockerfile: demo/Dockerfile
      args:
        NEXT_PUBLIC_SIGNALING_URL: ${NEXT_PUBLIC_SIGNALING_URL:-ws://localhost:8080/ws}
    ports:
      - "127.0.0.1:${SHADOWCAST_DEMO_PORT:-3000}:3000"
    depends_on:
      - signaling
